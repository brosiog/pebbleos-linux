name: Linux adapter protocol
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: CC=clang sh tests/linux_adapter/run.sh
      - if: runner.os == 'Linux'
        run: CC=clang sh tests/linux_adapter/run_display_regressions.sh
